name: Build MAQSAD APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master, feat/maqsad-reference-redesign ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: maqsad-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install JavaScript dependencies
        run: npm install
      - name: Validate embedded application scripts
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const html = fs.readFileSync('www/index.html', 'utf8');
          const scripts = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)];
          if (!scripts.length) throw new Error('No inline application script found');
          scripts.forEach((match, index) => new vm.Script(match[1], { filename: 'www/index.html:inline-' + index }));
          console.log('Embedded application scripts passed syntax validation.');
          NODE
      - name: Build Supabase client bundle
        run: npm run build

      - name: Generate Supabase client configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const config = {
            url: process.env.SUPABASE_URL || '',
            publishableKey: process.env.SUPABASE_PUBLISHABLE_KEY || ''
          };
          fs.writeFileSync('www/supabase-config.js',
            'window.MAQSAD_SUPABASE_CONFIG = ' + JSON.stringify(config) + ';\n');
          if (!config.url || !config.publishableKey) {
            console.log('Supabase secrets are not configured; app will use local-only mode.');
          } else {
            console.log('Supabase client configuration generated.');
          }
          NODE

      - name: Generate Android project
        run: npx cap add android

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MAQSAD-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
